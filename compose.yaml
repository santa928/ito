services:
  web:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      - HOST=0.0.0.0
    command: sh -c "npm install && npm run dev"
    tty: true
  e2e:
    image: mcr.microsoft.com/playwright:v1.59.1-noble
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      - HOST=0.0.0.0
    command: sh
    tty: true

volumes:
  node_modules:
